name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A newer push cancels this job. The lock is job-level so it ends with Verify and
  # can never reach a running release.
  verify:
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: release-verify-${{ github.ref }}
      cancel-in-progress: true
    uses: ./.github/workflows/verify.yml

  # One lock covers every mutation. GitHub may replace a pending release; it never
  # cancels the running one. The latest-main guard rejects superseded commits.
  release:
    name: Ordered production release
    needs: verify
    if: needs.verify.outputs.eligible == 'true'
    concurrency:
      group: production-release
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-dependencies
      - name: Reject superseded commits before mutations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch --no-tags origin "$current"
          node scripts/release-guard.mjs "$GITHUB_SHA" "$current"
      - name: D1, Worker, Vercel, smoke
        env:
          CI: 'true'
          RELEASE_SETUP_CONFIRMED: ${{ vars.RELEASE_SETUP_CONFIRMED }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          PRODUCTION_APP_URL: ${{ vars.PRODUCTION_APP_URL }}
          MEDICINES_WORKER_URL: ${{ vars.MEDICINES_WORKER_URL }}
        run: bash scripts/release.sh
      - name: Release result and recovery
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          echo "Release $GITHUB_SHA - $RESULT. Recovery: docs/deployment.md. Rerun all jobs to repeat checks before mutations." >> "$GITHUB_STEP_SUMMARY"
