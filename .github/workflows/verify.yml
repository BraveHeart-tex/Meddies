name: Verify

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  static:
    name: Static
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck

  unit:
    name: Unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Production build
        env:
          CI_SKIP_BUILD_TYPECHECK: '1'
        run: pnpm build
      - run: pnpm test

  journeys:
    name: Journeys
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Production build
        env:
          CI_SKIP_BUILD_TYPECHECK: '1'
        run: pnpm build
      - name: Worker build
        run: pnpm worker:build
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      # Restore and save separately so a failing journey still saves a fresh browser cache.
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Save Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: Browser journeys
        run: pnpm test:browser
      - name: Upload browser artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-artifacts-${{ github.run_attempt }}
          path: .browser-artifacts/
          # upload-artifact skips dot-directories unless hidden files are included.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  # Branch protection is configured against the `Checks` status context. Keep this name.
  checks:
    name: Checks
    needs: [static, unit, journeys]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verification result
        env:
          COMMIT: ${{ github.sha }}
          STATIC: ${{ needs.static.result }}
          UNIT: ${{ needs.unit.result }}
          JOURNEYS: ${{ needs.journeys.result }}
        # Failed, cancelled and skipped needs all fail this job.
        run: |
          echo "Verification for $COMMIT - Static $STATIC, Unit $UNIT, Journeys $JOURNEYS" >> "$GITHUB_STEP_SUMMARY"
          [[ "$STATIC" == success && "$UNIT" == success && "$JOURNEYS" == success ]]
