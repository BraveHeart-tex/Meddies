name: Verify

on:
  pull_request:
  workflow_call:
    outputs:
      eligible:
        description: Whether this SHA still qualifies for release
        value: ${{ jobs.eligibility.outputs.eligible }}

permissions:
  contents: read

# Release owns cancellation for main. A per-run group keeps its calls from queueing here.
concurrency:
  group: verify-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  eligibility:
    name: Release eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      eligible: ${{ steps.early.outputs.eligible }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check release eligibility before verification
        id: early
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          git -c credential.helper= -c 'credential.helper=!gh auth git-credential' fetch --no-tags origin "$current"
          node scripts/release-guard.mjs "$GITHUB_SHA" "$current" --early

  vitest:
    name: Vitest
    needs: eligibility
    if: needs.eligibility.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-dependencies
      # HTTP integration tests start the production server from this build.
      - run: pnpm build
      # No project filter: future projects belong to the release gate too.
      - run: pnpm test

  journeys:
    name: Journeys
    needs: eligibility
    if: needs.eligibility.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-dependencies
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - name: Restore Next.js build cache
        id: next-cache
        uses: actions/cache/restore@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next-cache-${{ hashFiles('pnpm-lock.yaml', 'next.config.ts') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-cache-${{ hashFiles('pnpm-lock.yaml', 'next.config.ts') }}-
            ${{ runner.os }}-next-cache-
      - name: Production build
        env:
          CI_SKIP_BUILD_TYPECHECK: '1'
        run: pnpm build
      # Only main saves, so pull requests cannot poison or evict its cache.
      - name: Save Next.js build cache
        if: (github.ref == 'refs/heads/main' && steps.next-cache.outputs.cache-hit != 'true')
        uses: actions/cache/save@v4
        with:
          path: .next/cache
          key: ${{ steps.next-cache.outputs.cache-primary-key }}

      - name: Worker build
        run: pnpm worker:build
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      # Restore and save separately so a failing journey still saves a fresh browser cache.
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: (steps.playwright-cache.outputs.cache-hit != 'true')
        run: pnpm exec playwright install --with-deps chromium
      - name: Save Playwright browsers
        if: (steps.playwright-cache.outputs.cache-hit != 'true')
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.playwright-cache.outputs.cache-primary-key }}
      - name: Install Chromium system dependencies
        if: (steps.playwright-cache.outputs.cache-hit == 'true')
        run: pnpm exec playwright install-deps chromium
      - name: Browser journeys
        run: pnpm test:browser
      - name: Upload browser artifacts
        if: (failure())
        uses: actions/upload-artifact@v4
        with:
          name: browser-artifacts-${{ github.run_attempt }}
          path: .browser-artifacts/
          # upload-artifact skips dot-directories unless hidden files are included.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
