<!-- @dsCard group="Meddies app" viewport="460x900" name="Meddies app — Today" subtitle="Interactive: Today, Medications, Record dose" -->
<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meddies — UI kit</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../../components/ds-loader.js"></script>
<script src="data.js"></script>
<style>body{background:#E9E1DC;min-height:100vh;display:flex;align-items:flex-start;justify-content:center;padding:28px 0}</style>
</head><body><div id="root"></div>
<script type="text/babel">
(async () => {
  const NS = await MeddiesDS.load('../../');
  await MeddiesDS.loadFiles(['TodayScreen.jsx', 'MedicationsScreen.jsx', 'RecordDoseSheet.jsx'], NS);
  const { BottomNav, Toast, Card, TodayScreen, MedicationsScreen, RecordDoseSheet } = NS;
  const D = window.MEDDIES_DATA;

  function StatusBar() {
    const bar = (h) => <span style={{ width: 3, height: h, background: 'currentColor', borderRadius: 1 }} />;
    return (
      <div style={{ height: 54, display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end', padding: '0 30px 8px 36px', font: '600 16px/1 -apple-system,system-ui,sans-serif', color: 'var(--text-primary)' }}>
        <span>{D.now}</span>
        <span style={{ display: 'flex', gap: 6, alignItems: 'center' }}>
          <span style={{ display: 'flex', gap: 2, alignItems: 'flex-end', height: 11 }}>{bar(4)}{bar(6)}{bar(8)}{bar(11)}</span>
          <span style={{ width: 25, height: 12, border: '1.5px solid currentColor', borderRadius: 4, padding: 1.5 }}><span style={{ display: 'block', width: '75%', height: '100%', background: 'currentColor', borderRadius: 1.5 }} /></span>
        </span>
      </div>
    );
  }

  function App() {
    const [tab, setTab] = React.useState(localStorage.getItem('meddies-kit-tab') || 'today');
    const [doses, setDoses] = React.useState(D.doses);
    const [sheet, setSheet] = React.useState({ open: false, id: null, outcome: null });
    const [toast, setToast] = React.useState(null);
    const prev = React.useRef(null);
    React.useEffect(() => { localStorage.setItem('meddies-kit-tab', tab); }, [tab]);
    React.useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 3200); return () => clearTimeout(t); }, [toast]);

    const dose = doses.find((d) => d.id === sheet.id);
    const med = dose && D.meds.find((m) => m.id === dose.medId);
    const notice = (msg) => setToast({ msg, icon: 'clock' });
    const save = ({ outcome, actual, qty }) => {
      prev.current = doses;
      setDoses(doses.map((d) => d.id === dose.id ? { ...d, status: outcome, actual, qty } : d));
      setSheet({ ...sheet, open: false });
      setToast({ msg: med.name + (outcome === 'taken' ? ' logged · taken at ' : ' marked as skipped · ') + (outcome === 'taken' ? actual : actual), icon: outcome === 'taken' ? 'check' : 'skipped', undo: true });
    };

    return (
      <div data-screen-label={tab} style={{ width: 402, height: 874, borderRadius: 52, overflow: 'hidden', position: 'relative', background: 'var(--bg-app)', boxShadow: '0 0 0 10px #241A1D, 0 40px 60px -24px rgba(60,20,30,.4)' }}>
        <StatusBar />
        <div style={{ position: 'absolute', top: 54, left: 0, right: 0, bottom: 0, overflowY: 'auto' }}>
          {tab === 'today' ? <TodayScreen data={D} doses={doses} onOpenDose={(id, outcome) => setSheet({ open: true, id, outcome })} onSettings={() => notice('Settings aren’t designed yet')} /> : null}
          {tab === 'medications' ? <MedicationsScreen data={D} onAdd={() => notice('Add medication isn’t designed yet')} onNotice={notice} /> : null}
          {tab === 'history' ? (
            <div style={{ padding: '14px 20px' }}>
              <div style={{ font: 'var(--type-display)' }}>History</div>
              <Card variant="dashed" padding={20} style={{ marginTop: 20 }}><div style={{ font: 'var(--type-card-title)' }}>Not designed yet</div><div style={{ font: 'var(--type-support)', color: 'var(--text-muted)', marginTop: 4 }}>History wasn’t part of the explored screens. Intentionally left blank.</div></Card>
            </div>
          ) : null}
        </div>
        {toast ? <Toast message={toast.msg} icon={toast.icon} actionLabel={toast.undo ? 'Undo' : undefined}
          onAction={() => { setDoses(prev.current); setToast(null); }} style={{ position: 'absolute', left: 16, right: 16, bottom: 110, zIndex: 10 }} /> : null}
        <BottomNav active={tab} onChange={setTab} />
        <RecordDoseSheet open={sheet.open} dose={dose} med={med} now={D.now} initialOutcome={sheet.outcome} onCancel={() => setSheet({ ...sheet, open: false })} onSave={save} />
        <div style={{ position: 'absolute', bottom: 8, left: '50%', marginLeft: -67, width: 134, height: 5, borderRadius: 3, background: 'var(--text-primary)', zIndex: 30 }} />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
})();
</script></body></html>
