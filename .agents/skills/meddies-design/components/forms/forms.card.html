<!-- @dsCard group="Components" viewport="700x420" name="Forms" subtitle="OutcomeChoice, ChipGroup, Stepper, TextField, Switch" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../ds-loader.js"></script>
<style>body{padding:20px;background:var(--bg-app)} .lbl{font:var(--type-eyebrow);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--text-muted)}</style>
</head><body><div id="root"></div>
<script type="text/babel">
MeddiesDS.load('../../').then((NS) => {
const { Icon, Button, IconButton, StatusBadge, Card, OutcomeChoice, ChipGroup, Stepper, TextField, Switch, PillTile, NextDoseCard, DoseCard, MedicationRow, AppHeader, BottomNav, Sheet, Toast } = NS;
const Row = ({label, children, gap=10}) => <div style={{display:'flex',flexDirection:'column',gap:8}}><span className="lbl">{label}</span><div style={{display:'flex',gap,alignItems:'center',flexWrap:'wrap'}}>{children}</div></div>;
function Demo(){
const [o,setO]=React.useState('taken'); const [t,setT]=React.useState('now'); const [q,setQ]=React.useState(1); const [s,setS]=React.useState(true);
return <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}}>
<div style={{display:'flex',flexDirection:'column',gap:14}}>
<span className="lbl">Outcome</span><OutcomeChoice value={o} onChange={setO}/>
<span className="lbl">Taken at</span><ChipGroup value={t} onChange={setT} options={[{value:'now',label:'Now · 14:38'},{value:'s',label:'At 14:00'},{value:'o',label:'Other',grow:false}]}/>
</div>
<div style={{display:'flex',flexDirection:'column',gap:14}}>
<span className="lbl">Stepper</span><Stepper value={q} onChange={setQ}/>
<span className="lbl">Text field</span><TextField icon="search" placeholder="Search medications"/>
<Switch label="Refill reminders" description="When 7 days are left" checked={s} onChange={setS}/>
</div></div>;}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
});
</script></body></html>
