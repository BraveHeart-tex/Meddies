<!-- @dsCard group="Components" viewport="700x400" name="Overlays" subtitle="Sheet, Toast" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../ds-loader.js"></script>
<style>body{padding:20px;background:var(--bg-app)} .lbl{font:var(--type-eyebrow);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--text-muted)}</style>
</head><body><div id="root"></div>
<script type="text/babel">
MeddiesDS.load('../../').then((NS) => {
const { Icon, Button, IconButton, StatusBadge, Card, OutcomeChoice, ChipGroup, Stepper, TextField, Switch, PillTile, NextDoseCard, DoseCard, MedicationRow, AppHeader, BottomNav, Sheet, Toast } = NS;
const Row = ({label, children, gap=10}) => <div style={{display:'flex',flexDirection:'column',gap:8}}><span className="lbl">{label}</span><div style={{display:'flex',gap,alignItems:'center',flexWrap:'wrap'}}>{children}</div></div>;
function Demo(){
return <div style={{display:'grid',gridTemplateColumns:'340px 1fr',gap:24,alignItems:'center'}}>
<div style={{position:'relative',height:360,borderRadius:28,overflow:'hidden',background:'var(--bg-app)',border:'1px solid var(--border-default)'}}>
<Sheet open label="Record dose" style={{padding:'10px 18px 22px',gap:14}}>
<div style={{display:'flex',gap:12,alignItems:'center'}}><PillTile tone="blush" shape="scored" size={52}/><div style={{flex:1}}><div style={{font:'var(--type-title)'}}>Magnesium</div><div style={{font:'var(--type-support)',color:'var(--text-muted)'}}>200 mg · tablet</div></div><IconButton icon="close" label="Close"/></div>
<OutcomeChoice value="taken"/>
<Button size="xl" fullWidth>Save as taken</Button>
</Sheet></div>
<div style={{display:'flex',flexDirection:'column',gap:12}}>
<Toast message="Magnesium logged · taken at 14:38" actionLabel="Undo"/>
<Toast message="Omega-3 marked as skipped" icon="skipped" actionLabel="Undo"/>
</div></div>;}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
});
</script></body></html>
