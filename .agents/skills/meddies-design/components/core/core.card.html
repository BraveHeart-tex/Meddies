<!-- @dsCard group="Components" viewport="700x430" name="Core" subtitle="Button, IconButton, StatusBadge, Card, Icon" -->
<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="../ds-loader.js"></script>
<style>body{padding:20px;background:var(--bg-app)} .lbl{font:var(--type-eyebrow);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;color:var(--text-muted)}</style>
</head><body><div id="root"></div>
<script type="text/babel">
MeddiesDS.load('../../').then((NS) => {
const { Icon, Button, IconButton, StatusBadge, Card, OutcomeChoice, ChipGroup, Stepper, TextField, Switch, PillTile, NextDoseCard, DoseCard, MedicationRow, AppHeader, BottomNav, Sheet, Toast } = NS;
const Row = ({label, children, gap=10}) => <div style={{display:'flex',flexDirection:'column',gap:8}}><span className="lbl">{label}</span><div style={{display:'flex',gap,alignItems:'center',flexWrap:'wrap'}}>{children}</div></div>;
function Demo(){
return <div style={{display:'flex',flexDirection:'column',gap:18}}>
<Row label="Buttons"><Button icon="check">Taken</Button><Button variant="secondary">Skip</Button><Button variant="soft" size="sm">Add schedule</Button><Button size="md" pill icon="plus">Add</Button><Button variant="ghost" size="md">Cancel</Button><Button disabled size="md">Disabled</Button></Row>
<Row label="Icon buttons"><IconButton icon="settings" label="Settings"/><IconButton icon="close" label="Close"/><IconButton icon="minus" label="Decrease" variant="sunken"/><IconButton icon="plus" label="Increase" variant="sunken"/></Row>
<Row label="Status — icon + word, never colour alone" gap={8}><StatusBadge status="taken" time="09:12"/><StatusBadge status="notLogged"/><StatusBadge status="scheduled"/><StatusBadge status="skipped" time="20:05"/><StatusBadge status="low" label="8 left" size="sm"/></Row>
<Row label="Cards"><Card style={{width:120,height:56}}/><Card variant="attention" style={{width:120,height:56}}/><Card variant="accent" style={{width:120,height:56}}/><Card variant="dashed" style={{width:120,height:56}}/></Row>
<Row label="Icons" gap={16}>{['check','clock','notLogged','skipped','warning','plus','minus','close','search','settings','today','medications','history','chevronRight'].map(n=><Icon key={n} name={n} size={20} color="var(--text-primary)"/>)}</Row>
</div>;}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
});
</script></body></html>
