<!-- @dsCard group="Colors" viewport="700x190" name="Semantic surfaces" subtitle="How tokens stack on a screen" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px 24px;background:var(--bg-app)} .m{font:500 11px/1.3 ui-monospace,Menlo,monospace;color:var(--text-muted)} .r{font:var(--weight-bold) 12px/1.3 var(--font-family-base);color:var(--text-secondary)}</style></head><body>
<div style="background:var(--bg-app);border:1px solid var(--border-default);border-radius:22px;padding:16px;display:flex;gap:12px">
<div style="flex:1;background:var(--surface-card);border:1px solid var(--border-default);border-radius:22px;padding:14px"><div style="font:var(--type-card-title)">--surface-card</div><div class="m">on --bg-app, 1px --border-default</div></div>
<div style="flex:1;background:var(--surface-accent);border-radius:28px;padding:14px"><div style="font:var(--type-card-title);color:var(--text-on-accent)">--surface-accent</div><div class="m">hero "Up next", active nav</div></div>
<div style="flex:1;background:var(--surface-sunken);border-radius:16px;padding:14px"><div style="font:var(--type-card-title)">--surface-sunken</div><div class="m">info rows, stepper keys</div></div></div>
</body></html>
