<!-- @dsCard group="Type" viewport="700x150" name="Times & numerals" subtitle="Tabular figures, 24-hour clock" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px 24px;background:var(--bg-app)} .m{font:500 11px/1.3 ui-monospace,Menlo,monospace;color:var(--text-muted)} .r{font:var(--weight-bold) 12px/1.3 var(--font-family-base);color:var(--text-secondary)}</style></head><body>
<div style="display:flex;gap:28px;align-items:flex-end">
<div><div class="m">scheduled</div><div style="font:800 40px/1 var(--font-family-base);color:var(--text-muted)">14:00</div></div>
<div><div class="m">actual</div><div style="font:800 40px/1 var(--font-family-base)">14:38</div></div>
<div style="font:var(--type-support);color:var(--text-secondary);max-width:300px">Always 24-hour HH:MM with tabular figures so lists align. Scheduled time is muted once a dose is logged; the actual time lives in the status badge.</div></div>
</body></html>
