<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px 24px;background:var(--bg-app)} .m{font:500 11px/1.3 ui-monospace,Menlo,monospace;color:var(--text-muted)} .r{font:var(--weight-bold) 12px/1.3 var(--font-family-base);color:var(--text-secondary)}</style></head><body>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
<div style="background:var(--status-taken-bg);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px"><span style="font:var(--type-eyebrow);letter-spacing:.06em;color:var(--status-taken-fg)">SAY</span><span style="font:var(--type-support)">“Not logged”</span><span style="font:var(--type-support)">“After Magnesium, nothing else until this evening.”</span><span style="font:var(--type-support)">“Magnesium logged · taken at 14:38”</span></div>
<div style="background:var(--surface-sunken);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px"><span style="font:var(--type-eyebrow);letter-spacing:.06em;color:var(--text-muted)">AVOID</span><span style="font:var(--type-support);color:var(--text-muted)">“Missed!” / “Overdue!”</span><span style="font:var(--type-support);color:var(--text-muted)">“Don’t break your 12-day streak 🔥”</span><span style="font:var(--type-support);color:var(--text-muted)">“Great job!!! 🎉”</span></div></div>
</body></html>
