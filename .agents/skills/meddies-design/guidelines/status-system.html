<!-- @dsCard group="Brand" viewport="700x190" name="Dose status system" subtitle="Shape + word + colour, always together" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px 24px;background:var(--bg-app)} .m{font:500 11px/1.3 ui-monospace,Menlo,monospace;color:var(--text-muted)} .r{font:var(--weight-bold) 12px/1.3 var(--font-family-base);color:var(--text-secondary)}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
<div style="background:var(--surface-card);border:1px solid var(--border-default);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px"><span style="align-self:flex-start;font:var(--type-chip);padding:6px 10px;border-radius:999px;background:var(--status-taken-bg);color:var(--status-taken-fg)">Taken</span><span style="font:var(--type-detail);color:var(--text-secondary)">Recorded intake. Shows actual time: “Taken 09:12”.</span></div><div style="background:var(--surface-card);border:1px solid var(--border-default);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px"><span style="align-self:flex-start;font:var(--type-chip);padding:6px 10px;border-radius:999px;background:var(--status-notlogged-bg);color:var(--status-notlogged-fg)">Not logged</span><span style="font:var(--type-detail);color:var(--text-secondary)">Reminder passed, nothing recorded. Never implies intake.</span></div><div style="background:var(--surface-card);border:1px solid var(--border-default);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px"><span style="align-self:flex-start;font:var(--type-chip);padding:6px 10px;border-radius:999px;border:1px solid var(--status-scheduled-border);color:var(--status-scheduled-fg)">Scheduled</span><span style="font:var(--type-detail);color:var(--text-secondary)">Upcoming. Outline only — nothing to do yet.</span></div><div style="background:var(--surface-card);border:1px solid var(--border-default);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px"><span style="align-self:flex-start;font:var(--type-chip);padding:6px 10px;border-radius:999px;background:var(--status-skipped-bg);color:var(--status-skipped-fg)">Skipped</span><span style="font:var(--type-detail);color:var(--text-secondary)">Deliberately not taken. Neutral, no judgement.</span></div></div>
</body></html>
