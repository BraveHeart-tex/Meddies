<!-- @dsCard group="Spacing" viewport="700x170" name="Elevation" subtitle="Flat cards; only floating chrome has shadow" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px 24px;background:var(--bg-app)} .m{font:500 11px/1.3 ui-monospace,Menlo,monospace;color:var(--text-muted)} .r{font:var(--weight-bold) 12px/1.3 var(--font-family-base);color:var(--text-secondary)}</style></head><body>
<div style="display:flex;gap:24px;align-items:center;padding:10px 0">
<div style="width:150px;height:84px;background:var(--surface-card);border:1px solid var(--border-default);border-radius:22px;display:flex;align-items:flex-end;padding:10px"><span class="m">card · none</span></div>
<div style="width:150px;height:84px;background:var(--surface-card);box-shadow:var(--shadow-float);border-radius:34px;display:flex;align-items:flex-end;padding:10px 16px"><span class="m">--shadow-float</span></div>
<div style="width:150px;height:84px;background:var(--cocoa-900);box-shadow:var(--shadow-toast);border-radius:18px;display:flex;align-items:flex-end;padding:10px"><span class="m" style="color:#E3D3C8">--shadow-toast</span></div>
<div style="width:150px;height:84px;background:var(--surface-sheet);box-shadow:var(--shadow-sheet);border-radius:32px 32px 0 0;display:flex;align-items:flex-end;padding:10px"><span class="m">--shadow-sheet</span></div></div>
</body></html>
