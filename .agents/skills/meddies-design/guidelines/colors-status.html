<!-- @dsCard group="Colors" viewport="700x160" name="Status colors" subtitle="Taken, not logged, scheduled, skipped, low stock" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px 24px;background:var(--bg-app)} .m{font:500 11px/1.3 ui-monospace,Menlo,monospace;color:var(--text-muted)} .r{font:var(--weight-bold) 12px/1.3 var(--font-family-base);color:var(--text-secondary)}</style></head><body>
<div style="display:grid;grid-template-columns:repeat(6,1fr);gap:12px"><div style="display:flex;flex-direction:column;gap:5px"><div style="height:56px;border-radius:14px;background:var(--status-taken-bg);"></div><div class="r">Taken bg</div><div class="m">--status-taken-bg<br>#E3EEE2</div></div><div style="display:flex;flex-direction:column;gap:5px"><div style="height:56px;border-radius:14px;background:var(--status-taken-fg);"></div><div class="r">Taken fg</div><div class="m">--status-taken-fg<br>#2F5F3D</div></div><div style="display:flex;flex-direction:column;gap:5px"><div style="height:56px;border-radius:14px;background:var(--status-notlogged-bg);"></div><div class="r">Not logged / low bg</div><div class="m">--status-notlogged-bg<br>#FBE9D2</div></div><div style="display:flex;flex-direction:column;gap:5px"><div style="height:56px;border-radius:14px;background:var(--status-notlogged-fg);"></div><div class="r">Not logged / low fg</div><div class="m">--status-notlogged-fg<br>#8A4E0E</div></div><div style="display:flex;flex-direction:column;gap:5px"><div style="height:56px;border-radius:14px;background:var(--status-skipped-bg);"></div><div class="r">Skipped bg</div><div class="m">--status-skipped-bg<br>#F3EAE1</div></div><div style="display:flex;flex-direction:column;gap:5px"><div style="height:56px;border-radius:14px;background:var(--status-skipped-fg);"></div><div class="r">Skipped fg</div><div class="m">--status-skipped-fg<br>#7A6266</div></div></div>
</body></html>
